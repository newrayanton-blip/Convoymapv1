<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convoy Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d21;--mut:#6b7280;--line:#e2e5ea;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#1a1e24;--text:#eef0f3;--mut:#9aa3af;--line:#2a3039;--acc:#60a5fa;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
#map{flex:1 1 auto;min-height:0}
#setup{flex:1;overflow-y:auto;padding:16px 14px 8px}
#gobar{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
#gobar button{font-size:18px;padding:16px}
#live{flex:1;display:flex;flex-direction:column;min-height:0}
body.live #setup,body.live #gobar{display:none}
body:not(.live) #live{display:none}
.bar button{flex:1}
#panel{flex:0 0 auto;max-height:46%;overflow-y:auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bar b{flex:1;font-size:18px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;width:100%;font-weight:600}
button.sm{width:auto;padding:7px 12px;font-size:14px;background:var(--card);color:var(--text);border:1px solid var(--line)}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--line)}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opt{width:auto;padding:6px 10px;background:var(--card);color:var(--text);border:2px solid var(--line);font-weight:500;font-size:15px}
.opt.on{border-color:var(--acc)}
.opt svg{width:36px;height:20px;vertical-align:middle;margin-right:6px}
.sw{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid transparent}.sw.on{border-color:var(--text)}
.cc{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;margin-bottom:8px}
input[type=color]{width:44px;height:32px;border:0;padding:0;background:none}
#status{color:var(--mut);font-size:14px;margin:8px 2px}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.row .nm{font-weight:600}.sub{color:var(--mut);font-size:13px}
.pw{text-align:center;width:90px}
.pin{display:inline-block;width:52px;height:34px;padding:5px 5px;background:#fff;border:3px solid;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin svg{width:40px;height:22px;display:block}
.lb{margin-top:2px;display:inline-block;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.92);color:#111;font-size:12px;font-weight:700;padding:1px 7px;border-radius:8px}
</style>
</head>
<body>
<div id="app">
<div id="setup">
  <h1 style="margin:0 0 12px;font-size:22px">🗺️ Convoy Map</h1>
  <input type="text" id="vname" maxlength="20" placeholder="Pangalan (hal. Kotse ni Ben)">
  <input type="text" id="vq" placeholder="Hanapin ang uri (hal. jeep, bangka, trike)">
  <div class="opts" id="types" style="max-height:260px;overflow-y:auto"></div>
  <div class="opts" id="colors"></div>
  <label class="cc">Sariling kulay: <input type="color" id="cc" value="#2563eb"></label>
  <div id="status">Pumili ng uri ng sasakyan, tapos pindutin ang GO para lumabas sa mapa.</div>
</div>
<div id="gobar"><button id="share">Pumili muna ng sasakyan</button></div>
<div id="live">
  <div id="map"></div>
  <div id="panel">
    <div class="bar"><button class="sm" id="stop" style="color:#dc2626">Itigil</button><button class="sm" id="inv">Imbitahin</button><button class="sm" id="fit">Fit lahat</button><button class="sm" id="trf">🚦 Traffic</button></div>
    <div style="display:flex;gap:8px;margin-bottom:8px"><input type="text" id="dq" placeholder="Saan pupunta? (hal. SM Fairview)" style="margin:0;flex:1"><button class="sm" id="dgo">Hanapin</button></div>
    <div id="dres"></div>
    <div id="dinfo" class="sub" style="margin-bottom:6px"></div>
    <button class="sm" id="dclr" style="display:none;margin-bottom:8px">Alisin ang destinasyon</button>
    <div id="st2" class="sub"></div>
    <div id="list"></div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
var TYPES=[["car","Kotse","sedan car auto"],["hatch","Hatchback","kotse"],["sports","Sports car","sedan racing"],["suv","SUV","crossover fortuner"],["pickup","Pickup","hilux ranger strada"],["van","Van","l300 hiace"],["jeep","Jeep","owner type"],["jeepney","Jeepney","dyip pampasahero"],["taxi","Taxi","grab cab"],["ambulance","Ambulansya","rescue"],["police","Pulis","police patrol"],["truck","Truck","trak cargo"],["dump","Dump truck","construction"],["trailer","Trailer","container 10 wheeler"],["firetruck","Bumbero","fire truck"],["bus","Bus","coaster"],["tractor","Traktora","farm"],["motor","Motor","motorsiklo motorcycle"],["scooter","Scooter","nmax click"],["bike","Bisikleta","bicycle bike"],["tricycle","Tricycle","trike sidecar"],["boat","Bangka","boat barko"],["helicopter","Helicopter","chopper"],["plane","Eroplano","plane"],["etrike","E-trike","electric tricycle ev e-trike"],["rv","RV","camper motorhome"],["kuliglig","Kuliglig","walking tractor"]];
var S=" stroke='rgba(0,0,0,.35)' stroke-width='.6'",W="<circle cx='10' cy='17.5' r='3.3' fill='#222'/><circle cx='30' cy='17.5' r='3.3' fill='#222'/>",G=" fill='#cfe8ff'";
var ICONS={
 car:"<path d='M2 17V12L9 11L13 6H26L31 11L38 12V17Z' fill='COL'"+S+"/><path d='M14 7.5H20V11H11.5ZM21.5 7.5H25.5L28.5 11H21.5Z'"+G+"/>"+W,
 pickup:"<path d='M2 17V10H18V6H28L33 11H38V17Z' fill='COL'"+S+"/><path d='M19.5 7.5H27L30 11H19.5Z'"+G+"/>"+W,
 suv:"<path d='M2 17V7L8 5H28L33 11H38V17Z' fill='COL'"+S+"/><path d='M10 6.5H18V11H10ZM19.5 6.5H27L30 11H19.5Z'"+G+"/>"+W,
 van:"<path d='M2 17V5H27L34 11H38V17Z' fill='COL'"+S+"/><path d='M22 6.5H27L31 11H22Z'"+G+"/>"+W,
 truck:"<rect x='2' y='3' width='23' height='14' rx='1' fill='COL'"+S+"/><path d='M26 17V8H32L37 12V17Z' fill='#e5e7eb'"+S+"/><path d='M28 9.5H31.5L34 12H28Z'"+G+"/>"+W,
 bus:"<rect x='2' y='3' width='36' height='14' rx='3' fill='COL'"+S+"/><path d='M5 5.5H35V10H5Z'"+G+"/>"+W,
 motor:"<circle cx='9' cy='16' r='4.2' fill='none' stroke='#222' stroke-width='2.2'/><circle cx='31' cy='16' r='4.2' fill='none' stroke='#222' stroke-width='2.2'/><path d='M9 16L16 9H25L31 16' fill='none' stroke='COL' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><rect x='13' y='5.5' width='10' height='4' rx='2' fill='COL'/><path d='M25 9L23 4H28' fill='none' stroke='#222' stroke-width='2' stroke-linecap='round'/>"
};
ICONS.hatch="<path d='M2 17V11L8 10L12 6H26L33 10L38 12V17Z' fill='COL'"+S+"/><path d='M13.5 7.5H19.5V10H10ZM21 7.5H25.5L29 10H21Z'"+G+"/>"+W;
ICONS.sports="<path d='M2 17V13L12 10L18 6H26L32 10L38 12V17Z' fill='COL'"+S+"/><path d='M19 7.5H25L29 10H17Z'"+G+"/>"+W;
ICONS.jeep="<path d='M2 17V11H38V17Z' fill='COL'"+S+"/><path d='M8 11V5H30V11M30 5L33 11' fill='none' stroke='#222' stroke-width='1.5'/>"+W;
ICONS.jeepney="<rect x='2' y='5' width='36' height='12' rx='2' fill='COL'"+S+"/><rect x='2' y='5' width='36' height='2.5' fill='#fff' opacity='.6'/><path d='M5 8.5H35V12H5Z'"+G+"/>"+W;
ICONS.taxi=ICONS.car+"<rect x='16' y='3.5' width='8' height='2.5' rx='1' fill='#facc15'/>";
ICONS.ambulance=ICONS.van+"<rect x='11' y='8' width='2' height='7' fill='#dc2626'/><rect x='8.5' y='10.5' width='7' height='2' fill='#dc2626'/>";
ICONS.police=ICONS.car+"<rect x='15' y='3.5' width='5' height='2.5' fill='#dc2626'/><rect x='20' y='3.5' width='5' height='2.5' fill='#2563eb'/>";
ICONS.firetruck=ICONS.truck+"<path d='M4 6H23' stroke='#fff' stroke-width='1.5'/>";
ICONS.dump="<path d='M2 17V7L5 4H24V17Z' fill='COL'"+S+"/><path d='M25 17V9H31L36 13V17Z' fill='#e5e7eb'"+S+"/><path d='M27 10.5H30.5L33 13H27Z'"+G+"/>"+W;
ICONS.trailer="<rect x='2' y='2' width='36' height='15' rx='1' fill='COL'"+S+"/><path d='M10 2V17M18 2V17M26 2V17M34 2V17' stroke='rgba(0,0,0,.25)'/>"+W;
ICONS.tractor="<circle cx='12' cy='14' r='6' fill='#222'/><circle cx='32' cy='16' r='3.5' fill='#222'/><path d='M16 15V8H26V12H35V15Z' fill='COL'"+S+"/><path d='M14 4H22V9H14Z' fill='#cfe8ff' stroke='#222' stroke-width='.8'/><rect x='30' y='4' width='1.5' height='7' fill='#222'/>";
ICONS.scooter="<circle cx='9' cy='16.5' r='3.5' fill='none' stroke='#222' stroke-width='2'/><circle cx='31' cy='16.5' r='3.5' fill='none' stroke='#222' stroke-width='2'/><path d='M10 15H23Q26 15 27 11L29 5H33' fill='none' stroke='COL' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><rect x='11' y='7' width='9' height='3' rx='1.5' fill='COL'/>";
ICONS.bike="<circle cx='9' cy='15' r='5' fill='none' stroke='#222' stroke-width='1.6'/><circle cx='31' cy='15' r='5' fill='none' stroke='#222' stroke-width='1.6'/><path d='M9 15L16 8H28L31 15M16 8L20 15L28 8' fill='none' stroke='COL' stroke-width='2' stroke-linejoin='round'/>";
ICONS.tricycle="<circle cx='8' cy='16.5' r='3.5' fill='none' stroke='#222' stroke-width='2'/><path d='M8 16L13 8H17' fill='none' stroke='#222' stroke-width='2'/><rect x='13' y='9' width='9' height='6' rx='2' fill='COL'"+S+"/><path d='M22 16V9H37V16Z' fill='COL'"+S+"/><path d='M25 10.5H35V13H25Z'"+G+"/><circle cx='31' cy='16.5' r='3.5' fill='#222'/>";
ICONS.boat="<path d='M2 13H38L33 18H7Z' fill='COL'"+S+"/><rect x='14' y='7' width='10' height='6' fill='#e5e7eb'"+S+"/><path d='M2 20Q6 18 10 20T18 20T26 20T34 20' fill='none' stroke='#38bdf8' stroke-width='1.5'/>";
ICONS.helicopter="<ellipse cx='17' cy='12' rx='10' ry='5' fill='COL'"+S+"/><rect x='26' y='10' width='11' height='2' fill='COL'/><path d='M4 5H30M17 5V8' stroke='#222' stroke-width='1.6'/><path d='M8 19H26' stroke='#222' stroke-width='1.6'/><ellipse cx='13' cy='11' rx='4' ry='2.5' fill='#cfe8ff'/>";
ICONS.plane="<ellipse cx='20' cy='11' rx='17' ry='3' fill='COL'"+S+"/><path d='M18 11L12 3H16L26 11ZM18 11L12 19H16L26 11Z' fill='COL'"+S+"/><path d='M5 11L2 5H6L9 11Z' fill='COL'"+S+"/>";
ICONS.etrike=ICONS.tricycle+"<path d='M30 1L26 6H29L27 9L32 4.5H29Z' fill='#facc15'/>";
ICONS.rv="<rect x='2' y='4' width='36' height='13' rx='3' fill='COL'"+S+"/><path d='M5 6.5H14V11H5ZM17 6.5H25V11H17ZM30 6.5H36L37 11H30Z'"+G+"/><path d='M2 13.5H38' stroke='#fff' stroke-width='1.2' opacity='.6'/>"+W;
ICONS.kuliglig="<circle cx='8' cy='15' r='4.5' fill='#222'/><path d='M8 14L14 5H18' fill='none' stroke='#222' stroke-width='2'/><rect x='9' y='8' width='8' height='5' rx='1.5' fill='COL'"+S+"/><path d='M20 15V8H38V15Z' fill='COL'"+S+"/><circle cx='29' cy='16' r='3.5' fill='#222'/>";
function ico(t,c){return (ICONS[t]||ICONS.car).replace(/COL/g,c||"#2563eb")}
var COLS=["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#db2777","#0891b2","#475569"];
var $=function(i){return document.getElementById(i)};
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
var veh={n:"",t:"",c:COLS[0]},Q="";
try{var sv=JSON.parse(localStorage.getItem("convoyVeh")||"null");if(sv&&ICONS[sv.t]&&/^#[0-9a-f]{6}$/i.test(sv.c))veh=sv}catch(e){}
function saveV(){try{localStorage.setItem("convoyVeh",JSON.stringify(veh))}catch(e){}}
var myId=null;try{myId=localStorage.getItem("convoyId")}catch(e){}
function rnd(){return Math.random().toString(36).slice(2,8)}
if(!myId){myId=rnd()+rnd();try{localStorage.setItem("convoyId",myId)}catch(e){}}
var room=(location.hash||"").slice(1).replace(/[^a-z0-9]/gi,"").toLowerCase();
if(room.length<8){room=rnd()+rnd();try{history.replaceState(null,"","#"+room)}catch(e){try{location.hash=room}catch(e2){}}}
var base="https://ntfy.sh/convoy-"+room;
function status(t){$("status").textContent=t;$("st2").textContent=t}
function typeLabel(){var f=TYPES.filter(function(t){return t[0]===veh.t})[0];return f?f[1]:"Sasakyan"}

var map=L.map("map").setView([12.9,121.8],5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
map.on("dragstart",function(){userMoved=true});
var dest=null,destTs=0,destMk=null,routeLn=null,routeFrom=null,routeAt=0,tfl=null,lastRes=[],userMoved=false,people={},markers={},watchId=null,sharing=false,lastPos=null,lastSend=0,fitT=null,wl=null;

function clean(d){
  if(!d||typeof d.lat!=="number"||typeof d.lng!=="number"||typeof d.id!=="string")return null;
  return{id:d.id.slice(0,20),n:String(d.n||"Sasakyan").slice(0,24),v:ICONS[d.v]?d.v:"car",c:/^#[0-9a-f]{6}$/i.test(d.c)?d.c:"#2563eb",lat:d.lat,lng:d.lng,ts:+d.ts||Date.now()};
}
function pinHtml(d){return '<div class="pw"><div class="pin" style="border-color:'+d.c+'"><svg viewBox="0 0 40 22">'+ico(d.v,d.c)+'</svg></div><div class="lb">'+esc(d.n)+'</div></div>'}
function upsert(d){
  people[d.id]=d;var ll=[d.lat,d.lng],ic=L.divIcon({html:pinHtml(d),className:"",iconSize:[90,60],iconAnchor:[45,20]});
  if(markers[d.id]){markers[d.id].setLatLng(ll);markers[d.id].setIcon(ic)}else markers[d.id]=L.marker(ll,{icon:ic}).addTo(map);
  markers[d.id].setOpacity(Date.now()-d.ts>120000?.5:1);
}
function drop(id){delete people[id];if(markers[id]){map.removeLayer(markers[id]);delete markers[id]}}
function fitAll(){var ids=Object.keys(people);if(!ids.length||!document.body.classList.contains("live"))return;
  var pts=ids.map(function(i){return[people[i].lat,people[i].lng]});if(dest)pts.push([dest.lat,dest.lng]);
  var b=L.latLngBounds(pts);
  pts.length===1?map.setView(b.getCenter(),16):map.fitBounds(b,{padding:[60,60],maxZoom:17})}
function handle(d){
  if(d&&d.off){drop(String(d.id));renderList();return}
  var raw=d;d=clean(d);if(!d||Date.now()-d.ts>1800000)return;
  syncDest(raw);
  var isNew=!people[d.id];upsert(d);renderList();if(d.id===myId)doRoute();
  if(isNew&&!userMoved){clearTimeout(fitT);fitT=setTimeout(fitAll,700)}
}
function dist(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function fmtD(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(m<10000?1:0)+" km"}
function ago(t){var s=Math.max(0,(Date.now()-t)/1000);if(s<30)return"live";if(s<3600)return Math.round(s/60)+" min ang nakaraan";return Math.round(s/3600)+" oras ang nakaraan"}
function renderList(){
  var ids=Object.keys(people),me=people[myId];
  if(!ids.length){$("list").innerHTML='<div class="sub" style="text-align:center;padding:12px">Wala pang naka-GPS.</div>';return}
  ids.sort(function(a,b){return a===myId?-1:b===myId?1:people[b].ts-people[a].ts});
  $("list").innerHTML=ids.map(function(i){var p=people[i],d=(me&&i!==myId)?" · "+fmtD(dist(me,p))+" ang layo":"";
    return '<div class="row" data-id="'+esc(i)+'"><svg viewBox="0 0 40 22" width="52" height="29" style="flex:none">'+ico(p.v,p.c)+'</svg><div><div class="nm">'+esc(p.n)+(i===myId?" (ikaw)":"")+'</div><div class="sub">'+ago(p.ts)+d+'</div></div></div>'}).join("");
}
$("list").addEventListener("click",function(e){var r=e.target.closest("[data-id]");if(!r)return;var p=people[r.dataset.id];if(p){userMoved=true;map.setView([p.lat,p.lng],17)}});
$("fit").onclick=function(){userMoved=false;fitAll()};
$("inv").onclick=function(){var u=location.href;
  if(navigator.share)navigator.share({title:"Convoy Map",text:"Sumali sa convoy map namin:",url:u}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){status("Na-copy ang link. I-paste sa kasama mo.")});
  else prompt("Kopyahin ang link:",u)};

var TOMTOM_KEY=""; /* ilagay dito ang libreng TomTom API key para sa live traffic */
function syncDest(r){
  if(r.dts===undefined||!(r.dts>destTs))return;
  dest=(r.dest&&typeof r.dest.lat==="number"&&typeof r.dest.lng==="number")?{lat:r.dest.lat,lng:r.dest.lng,name:String(r.dest.name||"Destinasyon").slice(0,40)}:null;
  destTs=r.dts;drawDest();
}
function setDest(d){dest=d;destTs=Date.now();userMoved=false;drawDest();if(sharing)push(true)}
function drawDest(){
  if(destMk){map.removeLayer(destMk);destMk=null}
  if(routeLn){map.removeLayer(routeLn);routeLn=null}
  $("dclr").style.display=dest?"":"none";
  if(!dest){$("dinfo").textContent="";return}
  destMk=L.marker([dest.lat,dest.lng],{icon:L.divIcon({html:'<div class="pw"><div style="font-size:30px;line-height:30px">📍</div><div class="lb">'+esc(dest.name)+'</div></div>',className:"",iconSize:[90,60],iconAnchor:[45,28]})}).addTo(map);
  $("dinfo").textContent="📍 "+dest.name;
  routeFrom=null;doRoute();if(!userMoved)fitAll();
}
function doRoute(){
  var me=people[myId];if(!dest||!me)return;
  var now=Date.now();if(routeFrom&&dist(routeFrom,me)<200&&now-routeAt<90000)return;
  routeFrom={lat:me.lat,lng:me.lng};routeAt=now;var tgt=dest;
  fetch("https://router.project-osrm.org/route/v1/driving/"+me.lng+","+me.lat+";"+dest.lng+","+dest.lat+"?overview=full&geometries=geojson")
  .then(function(r){return r.json()}).then(function(j){
    if(tgt!==dest||!j.routes||!j.routes[0])return;var r=j.routes[0];
    if(routeLn)map.removeLayer(routeLn);
    routeLn=L.geoJSON(r.geometry,{style:{color:"#2563eb",weight:6,opacity:.85}}).addTo(map);
    $("dinfo").textContent="📍 "+dest.name+" · "+fmtD(r.distance)+" · mga "+Math.max(1,Math.round(r.duration/60))+" min (estimate, walang traffic)";
  }).catch(function(){if(tgt===dest)$("dinfo").textContent="📍 "+dest.name+" · hindi makuha ang ruta ngayon"});
}
function search(){
  var q=$("dq").value.trim();if(!q)return;$("dres").innerHTML='<div class="sub">Naghahanap…</div>';
  var b=map.getBounds();
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&q="+encodeURIComponent(q)+"&viewbox="+[b.getWest(),b.getNorth(),b.getEast(),b.getSouth()].join(","))
  .then(function(r){return r.json()}).then(function(j){
    lastRes=j||[];
    $("dres").innerHTML=lastRes.length?lastRes.map(function(r,i){return '<button class="sm" data-i="'+i+'" style="display:block;width:100%;text-align:left;margin-bottom:6px">'+esc(r.display_name.split(",").slice(0,3).join(","))+'</button>'}).join(""):'<div class="sub">Walang nahanap.</div>';
  }).catch(function(){$("dres").innerHTML='<div class="sub">Hindi makapaghanap ngayon.</div>'});
}
$("dgo").onclick=search;
$("dq").onkeydown=function(e){if(e.key==="Enter")search()};
$("dres").onclick=function(e){var b=e.target.closest("[data-i]");if(!b)return;var r=lastRes[+b.dataset.i];if(!r)return;
  $("dres").innerHTML="";$("dq").value="";setDest({lat:+r.lat,lng:+r.lon,name:r.display_name.split(",").slice(0,2).join(",").trim()})};
$("dclr").onclick=function(){setDest(null)};
map.on("contextmenu",function(e){setDest({lat:e.latlng.lat,lng:e.latlng.lng,name:"Napiling lugar"})});
$("trf").onclick=function(){
  if(!TOMTOM_KEY){status("Para sa live traffic, kailangan ng libreng TomTom API key.");return}
  if(tfl){map.removeLayer(tfl);tfl=null;$("trf").style.borderColor="";return}
  tfl=L.tileLayer("https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key="+TOMTOM_KEY,{maxZoom:19,opacity:.85}).addTo(map);$("trf").style.borderColor="#16a34a"};
function connect(){
  var es=new EventSource(base+"/sse?since=20m");
  es.onmessage=function(e){try{var m=JSON.parse(e.data);if(m.event&&m.event!=="message")return;handle(JSON.parse(m.message))}catch(x){}};
}
function send(d){fetch(base,{method:"POST",body:JSON.stringify(d)}).catch(function(){status("Walang internet o hindi maipadala.")})}
function push(force){
  if(!lastPos)return;var now=Date.now();if(!force&&now-lastSend<8000)return;lastSend=now;
  var d={id:myId,n:veh.n||typeLabel(),v:veh.t,c:veh.c,lat:lastPos.coords.latitude,lng:lastPos.coords.longitude,ts:now,dest:dest,dts:destTs};
  handle(d);send(d);
}
function setBtn(){var b=$("share");if(sharing)return;b.disabled=!veh.t;b.style.opacity=veh.t?1:.5;b.className="";b.textContent=veh.t?"GO – Buksan ang GPS":"Pumili muna ng sasakyan"}
function start(){
  if(!veh.t){status("Pumili muna ng uri ng sasakyan.");return}
  if(!navigator.geolocation){status("Hindi kayang mag-GPS ng device na ito.");return}
  document.body.classList.add("live");try{map.invalidateSize()}catch(e){}userMoved=false;sharing=true;
  status("Hinahanap ang GPS… lumabas sa bukas na lugar kung matagal.");
  function ok(p){try{var first=!lastPos;lastPos=p;status("Live ka na sa mapa. Iwanang bukas ang app.");push(first);if(first)setTimeout(fitAll,400)}catch(e){status("May error: "+e.message)}}
  function bad(e){if(e.code===1){status("Hindi pinayagan ang location. I-enable sa browser settings.");stop(true)}else status("Hinahanap pa ang GPS… i-on ang Location/GPS ng phone.")}
  navigator.geolocation.getCurrentPosition(ok,function(){},{enableHighAccuracy:false,maximumAge:60000,timeout:15000});
  watchId=navigator.geolocation.watchPosition(ok,bad,{enableHighAccuracy:true,maximumAge:3000,timeout:30000});
  $("share").textContent="Itigil ang GPS";$("share").className="sec";
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}
}
function stop(keep){
  document.body.classList.remove("live");
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;sharing=false;
  try{wl&&wl.release()}catch(e){}wl=null;setBtn();
  if(!keep){send({id:myId,off:1});drop(myId);renderList();status("Tinigil mo na ang GPS.")}
}
$("share").onclick=function(){watchId==null?start():stop(false)};
$("stop").onclick=function(){stop(false)};
setInterval(function(){if(sharing)push(true)},15000);
setInterval(renderList,30000);

function buildPicker(){
  $("vname").value=veh.n;
  $("types").innerHTML=TYPES.filter(function(t){return (t[1]+" "+t[2]).toLowerCase().indexOf(Q)>-1}).map(function(t){
    return '<button class="opt'+(veh.t===t[0]?' on':'')+'" data-t="'+t[0]+'"><svg viewBox="0 0 40 22">'+ico(t[0],veh.c)+'</svg>'+t[1]+'</button>'}).join("");
  $("colors").innerHTML=COLS.map(function(c){return '<button class="sw'+(veh.c===c?' on':'')+'" data-c="'+c+'" style="background:'+c+'" aria-label="Kulay"></button>'}).join("");
  $("cc").value=veh.c;setBtn();
}
function changed(){saveV();buildPicker();if(sharing)push(true)}
$("types").onclick=function(e){var b=e.target.closest("[data-t]");if(b){veh.t=b.dataset.t;changed()}};
$("colors").onclick=function(e){var b=e.target.closest("[data-c]");if(b){veh.c=b.dataset.c;changed()}};
$("cc").onchange=function(e){veh.c=e.target.value;changed()};
$("vq").oninput=function(e){Q=e.target.value.trim().toLowerCase();buildPicker()};
$("vname").oninput=function(e){veh.n=e.target.value;saveV();clearTimeout(window._nt);window._nt=setTimeout(function(){if(sharing)push(true)},600)};
buildPicker();renderList();connect();
})();
</script>
</body>
</html>
