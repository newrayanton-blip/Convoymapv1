<!DOCTYPE html>
<html lang="tl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Convoy Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{color-scheme:light;--bg:#f3f4f7;--card:#fff;--card2:#f6f8fb;--text:#0f172a;--mut:#64748b;--line:rgba(15,23,42,.09);--acc:#2563eb;--onacc:#fff;--accsoft:rgba(37,99,235,.10);--glass:rgba(255,255,255,.88);--sh:0 8px 28px rgba(15,23,42,.18);--mapbg:#e8eaed}
:root[data-theme=dark]{color-scheme:dark;--bg:#090d12;--card:#141a22;--card2:#1a212b;--text:#f1f5f9;--mut:#94a3b8;--line:rgba(255,255,255,.09);--acc:#60a5fa;--onacc:#07101f;--accsoft:rgba(96,165,250,.15);--glass:rgba(17,23,31,.86);--sh:0 8px 28px rgba(0,0,0,.55);--mapbg:#1b1f25}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub{color:var(--mut);font-size:13px}.nm{font-weight:600}

/* ---------- SETUP ---------- */
#setup{flex:1;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;background:radial-gradient(120% 55% at 50% 0%,var(--accsoft),transparent 62%),var(--bg)}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:grid;place-items:center;box-shadow:0 8px 20px rgba(79,70,229,.4);flex:none}
.logo svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.tag{color:var(--mut);font-size:13.5px;margin-top:2px}
.pv{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
.pvb{width:68px;height:68px;border-radius:50%;background:#fff;border:3.5px solid var(--acc);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:border-color .2s}
.pvb svg{width:46px;height:26px}
.pvn{font-weight:700;font-size:18px;letter-spacing:-.2px}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin:22px 2px 9px}
input[type=text]{font:inherit;width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
input::placeholder{color:var(--mut);opacity:.8}
.sf{position:relative;margin-bottom:10px}
.sf svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.sf input{padding-left:42px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.opt{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;font-size:12.5px;font-weight:600;text-align:center;transition:transform .1s,border-color .15s,background .15s}
.opt svg{width:56px;height:31px}
.opt:active{transform:scale(.96)}
.opt.on{border-color:var(--acc);background:var(--accsoft);box-shadow:0 0 0 3px var(--accsoft)}
.colrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 4px rgba(0,0,0,.25);transition:transform .1s}
.sw.on{outline:2.5px solid var(--text);outline-offset:2px;transform:scale(1.05)}
.cc{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;font-weight:600;flex:none}
input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
#status{color:var(--mut);font-size:13px;margin:20px 2px 4px;text-align:center}
#gobar{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#gobar button{width:100%;font-size:17px;font-weight:700;padding:16px;border-radius:18px;letter-spacing:.2px;color:#fff;background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 8px 22px rgba(22,163,74,.4);transition:transform .1s}
#gobar button:active{transform:scale(.98)}
#gobar button:disabled{background:var(--card2);color:var(--mut);box-shadow:none;border:1px solid var(--line);font-weight:600}
#gobar button.sec{background:transparent;color:var(--mut);box-shadow:none;border:1px solid var(--line)}
body.live #setup,body.live #gobar{display:none}
body:not(.live) #live{display:none}

/* ---------- LIVE MAP ---------- */
#live{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;z-index:0;background:var(--mapbg)}
.leaflet-container{font:inherit}
.leaflet-control-attribution{display:none}
#topbar{position:absolute;z-index:1000;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:70px}
#sb{display:flex;align-items:center;gap:4px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--sh)}
#sb>svg{margin-left:10px;color:var(--mut);flex:none}
#sb input{border:0;background:transparent;box-shadow:none;padding:9px 8px;flex:1;min-width:0}
#sb input:focus{box-shadow:none}
#dgo{padding:10px 16px;border-radius:13px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:14px}
#dres{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;margin-top:8px;box-shadow:var(--sh);overflow:hidden}
#dres button,#dres .sub{display:block;width:100%;text-align:left;border-bottom:1px solid var(--line);font-weight:500;font-size:14.5px;padding:12px 14px}
#dres button:last-child,#dres .sub:last-child{border-bottom:0}
#dres:empty{display:none}
#fab{position:absolute;z-index:1000;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
#fab button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .1s}
#fab button:active{transform:scale(.92)}
#toast{display:none;position:absolute;z-index:1100;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:82%;background:rgba(15,23,42,.94);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:14px;text-align:center;box-shadow:var(--sh)}
#panel{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:var(--card);border-top:1px solid var(--line);border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
#hd{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:9px 0 10px;color:var(--mut);font-size:12.5px;font-weight:600}
.grab{width:38px;height:4.5px;border-radius:3px;background:var(--mut);opacity:.4}
#panel.min #more{display:none}
body.full #panel,body.full #topbar{display:none}
.dc{display:flex;align-items:center;gap:12px}
.dpin{width:42px;height:42px;border-radius:14px;background:rgba(239,68,68,.13);display:grid;place-items:center;flex:none}
.dpin svg{width:22px;height:22px}
.dt{min-width:0}
.dn{font-weight:700;font-size:17px;line-height:1.25;letter-spacing:-.2px}
.nv{display:flex;align-items:center;gap:14px;padding:4px 0 2px}
.rc{width:56px;height:56px;border-radius:50%;background:var(--text);color:var(--card);display:grid;place-items:center;flex:none}
.rc svg{width:26px;height:26px;stroke-width:2.6}
.nvt{flex:1;min-width:0}
.nvm{font-size:24px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}
.dk{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.nvt .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{padding:14px 18px;border-radius:999px;background:var(--accsoft);color:var(--acc);font-weight:800;font-size:16px;flex:none}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:15px;padding:11px 14px;color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;margin:14px 0 4px}
.pill{flex:1;padding:12px 10px;border-radius:14px;font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.pill.pri{background:var(--acc);color:var(--onacc);border-color:transparent}
.pill.dng{color:#ef4444}
#st2{margin:8px 2px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:46px;height:46px;border-radius:50%;border:3px solid;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.av svg{width:30px;height:17px}
.cr{font-size:11px;margin-top:10px;text-align:center}

/* ---------- PINS ---------- */
.pw{position:relative;width:100px;height:76px}
.bd{position:absolute;left:26px;top:0;width:48px;height:48px;border-radius:50%;background:#fff;border:3.5px solid;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.bd svg{width:32px;height:18px}
.pl{position:absolute;left:26px;top:0;width:48px;height:48px;border-radius:50%;opacity:0;animation:pl 2.2s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.1);opacity:0}}
.lb{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;max-width:100px;background:#fff;color:#0f172a;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.lb i{width:8px;height:8px;border-radius:50%;flex:none}
.lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp{width:110px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.lb2{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#0f172a;color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:10px;margin-bottom:3px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.dp svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
:root[data-theme=light] #map .leaflet-tile-pane{filter:saturate(.42) brightness(1.04)}
.fl{filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.hi{position:absolute;left:26px;top:0;width:48px;height:48px;pointer-events:none}
.hi i{position:absolute;left:50%;top:-13px;margin-left:-8px;border:8px solid transparent;border-bottom:12px solid #000;border-top:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#fab button.on{color:var(--acc);box-shadow:0 0 0 2.5px var(--acc),var(--sh)}
.mw{position:relative;width:100px;height:84px}
.halo{position:absolute;left:12px;top:-4px;width:76px;height:76px;border-radius:50%;background:rgba(20,184,196,.18);border:1.5px solid rgba(20,184,196,.35)}
.ar{position:absolute;left:28px;top:12px;width:44px;height:44px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));transition:transform .4s}
.mw .lb{top:68px}
.rlw{width:0;height:0}
.rl{position:absolute;left:-8px;bottom:10px;white-space:nowrap;background:#4b0fa0;color:#fff;font-weight:700;font-size:14px;padding:6px 12px;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.rl::after{content:"";position:absolute;left:10px;bottom:-7px;border:7px solid transparent;border-top-color:#4b0fa0;border-bottom:0}
#nav{display:none;position:absolute;z-index:1001;left:0;right:0;top:0;background:#000;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 16px 18px;align-items:center;gap:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
body.nav #nav{display:flex}
body.nav #topbar{display:none}
body.nav #fab{top:calc(122px + env(safe-area-inset-top,0px))}
body.nav #toast{top:calc(130px + env(safe-area-inset-top,0px))}
body.nav.full #nav{display:none}
body.nav.full #fab{top:calc(12px + env(safe-area-inset-top,0px))}
#nav svg{width:54px;height:54px;flex:none}
.nvb{flex:1;min-width:0}
#nvd{font-size:36px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
#nvn{font-size:23px;font-weight:700;color:#22d3ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nvx{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none;color:#fff}
</style>
</head>
<body>
<div id="app">
<div id="setup">
  <div class="hero">
    <div class="logo"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h5.5"/></svg></div>
    <div><h1>Convoy</h1><div class="tag">Live na mapa para sa buong biyahe · v4</div></div>
  </div>
  <div class="pv"><div class="pvb" id="pvb"><svg id="pvi" viewBox="0 0 40 22"></svg></div><div><div class="pvn" id="pvn"></div><div class="sub" id="pvs"></div></div></div>

  <div class="sec">Pangalan</div>
  <input type="text" id="vname" maxlength="20" placeholder="Hal. Kotse ni Ben">

  <div class="sec">Uri ng sasakyan</div>
  <div class="sf"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="text" id="vq" placeholder="Hanapin (hal. jeep, bangka, trike)"></div>
  <div class="grid" id="types"></div>

  <div class="sec">Kulay</div>
  <div class="colrow"><div class="sws" id="colors"></div><label class="cc"><input type="color" id="cc" value="#2563eb"><span>Iba pa</span></label></div>

  <div id="status">Pumili ng uri ng sasakyan, tapos pindutin ang GO para lumabas sa mapa.</div>
</div>
<div id="gobar"><button id="share">Pumili muna ng sasakyan</button></div>

<div id="live">
  <div id="map"></div>
  <div id="nav"><svg id="nvs" viewBox="0 0 48 48"></svg><div class="nvb"><div id="nvd">—</div><div id="nvn"></div></div><button id="nvx" aria-label="Alisin ang destinasyon"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="topbar">
    <div id="sb"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="text" id="dq" placeholder="Saan pupunta?"><button id="dgo">Hanapin</button></div>
    <div id="dres"></div>
  </div>
  <div id="fab">
    <button id="fit" aria-label="Re-center"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button id="ovb" aria-label="Overview"><svg class="i" viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg></button>
    <button id="trf" aria-label="Traffic"><svg class="i" viewBox="0 0 24 24"><rect x="7.5" y="2" width="9" height="20" rx="3"/><circle cx="12" cy="7" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="17" r="1"/></svg></button>
    <button id="thm" aria-label="Estilo ng mapa"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    <button id="full" aria-label="Full view"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="toast"></div>
  <div id="panel" class="min">
    <button id="hd"><span class="grab"></span><span id="hdt">Mga sasakyan at opsyon</span></button>
    <div id="dinfo"></div>
    <div id="more">
      <div class="bar"><button class="pill pri" id="inv">Imbitahin</button><button class="pill" id="dclr" style="display:none">Alisin ang destinasyon</button><button class="pill dng" id="stop">Itigil</button></div>
      <div id="st2" class="sub"></div>
      <div class="sec">Mga sasakyan</div>
      <div id="list"></div>
      <div class="sub cr">© OpenStreetMap · Esri · Leaflet</div>
    </div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

};

  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}
}
function stop(keep){
  document.body.classList.remove("live","full","nav");
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;sharing=false;lastPos=null;
  try{wl&&wl.release()}catch(e){}wl=null;setBtn();
  if(!keep){send({id:myId,off:1});drop(myId);renderList();$("status").textContent="Tinigil mo na ang GPS."}
}
$("share").onclick=function(){watchId==null?start():stop(false)};
$("stop").onclick=function(){stop(false)};
setInterval(function(){if(sharing)push(true)},15000);
setInterval(renderList,30000);

function buildPicker(){
  $("vname").value=veh.n;
  var list=TYPES.filter(function(t){return (t[1]+" "+t[2]).toLowerCase().indexOf(Q)>-1});
  $("types").innerHTML=list.length?list.map(function(t){
    return '<button class="opt'+(veh.t===t[0]?' on':'')+'" data-t="'+t[0]+'"><svg viewBox="0 0 40 22">'+ico(t[0],veh.c)+'</svg><span>'+t[1]+'</span></button>'}).join(""):'<div class="sub" style="grid-column:1/-1;padding:10px 2px">Walang nahanap na uri.</div>';
  $("colors").innerHTML=COLS.map(function(c){return '<button class="sw'+(veh.c===c?' on':'')+'" data-c="'+c+'" style="background:'+c+'" aria-label="Kulay"></button>'}).join("");
  $("cc").value=veh.c;
  $("pvb").style.borderColor=veh.c;$("pvi").innerHTML=ico(veh.t||"car",veh.c);
  $("pvn").textContent=veh.n||(veh.t?typeLabel():"Ang sasakyan mo");
  $("pvs").textContent=veh.t?"Ganito ka lalabas sa mapa":"Pumili ng uri sa ibaba";
  setBtn();
}
function changed(){saveV();buildPicker();if(sharing)push(true)}
$("types").onclick=function(e){var b=e.target.closest("[data-t]");if(b){veh.t=b.dataset.t;changed()}};
$("colors").onclick=function(e){var b=e.target.closest("[data-c]");if(b){veh.c=b.dataset.c;changed()}};
$("cc").onchange=function(e){veh.c=e.target.value;changed()};
$("vq").oninput=function(e){Q=e.target.value.trim().toLowerCase();buildPicker()};
$("vname").oninput=function(e){veh.n=e.target.value;saveV();$("pvn").textContent=veh.n||(veh.t?typeLabel():"Ang sasakyan mo");clearTimeout(window._nt);window._nt=setTimeout(function(){if(sharing)push(true)},600)};
function FLAG(s){var q="";for(var i=0;i<4;i++)for(var j=0;j<4;j++)if((i+j)%2)q+='<rect x="'+(4+8*i)+'" y="'+(4+8*j)+'" width="8" height="8" fill="#111"/>';
  return '<svg viewBox="0 0 40 40" width="'+s+'" height="'+s+'"><defs><clipPath id="cfl"><circle cx="20" cy="20" r="16"/></clipPath></defs><circle cx="20" cy="20" r="19" fill="#fff"/><g clip-path="url(#cfl)"><rect x="4" y="4" width="32" height="32" fill="#fff"/>'+q+'</g><circle cx="20" cy="20" r="16" fill="none" stroke="#111" stroke-width="1.5"/></svg>'}
var ARR={right:"M14 42V28a10 10 0 0 1 10-10h14M30 9l9 9-9 9",left:"M34 42V28a10 10 0 0 0-10-10H10M18 9l-9 9 9 9",straight:"M24 42V8M12 20L24 8l12 12",sr:"M16 42V28L32 14M22 12h12v12",sl:"M32 42V28L16 14M26 12H14v12",uturn:"M14 42V20a10 10 0 0 1 20 0v6M26 20l8 8 8-8",arrive:"M14 8v34M14 10h22l-5 8 5 8H14"};
function arrKey(m){if(m.type==="arrive")return"arrive";var x=m.modifier||"straight";if(x==="uturn")return"uturn";if(x==="slight right")return"sr";if(x==="slight left")return"sl";if(x.indexOf("right")>-1)return"right";if(x.indexOf("left")>-1)return"left";return"straight"}
function updateBanner(){
  var me=people[myId],ok=!!(dest&&routeSteps&&routeSteps.length&&me);
  document.body.classList.toggle("nav",ok);if(!ok)return;
  var best=1e12,j=0;
  routeSteps.forEach(function(s,i){if(!s.geometry)return;s.geometry.coordinates.forEach(function(c){var d=dist(me,{lat:c[1],lng:c[0]});if(d<best){best=d;j=i}})});
  var nx=routeSteps[j+1]||routeSteps[j],mv=nx.maneuver,m=mv.location,k=arrKey(mv);
  $("nvs").innerHTML='<path d="'+ARR[k]+'" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
  $("nvd").textContent=fmtD(dist(me,{lat:m[1],lng:m[0]}));
  $("nvn").textContent=k==="arrive"?dest.name:(nx.name||"Magpatuloy");
}
function buildSteps(r){
  if(rlG){map.removeLayer(rlG);rlG=null}
  var st=(r.legs&&r.legs[0]&&r.legs[0].steps)||[],ms=[],last="";routeSteps=st;
  st.forEach(function(s,i){if(i===0||!s.name||s.name===last||s.distance<120||s.maneuver.type==="arrive"||!s.geometry)return;last=s.name;
    var cs=s.geometry.coordinates,m=cs[Math.floor(cs.length/2)],nm=s.name.length>26?s.name.slice(0,25)+"…":s.name;
    ms.push(L.marker([m[1],m[0]],{interactive:false,keyboard:false,zIndexOffset:200,icon:L.divIcon({className:"rlw",iconSize:[0,0],html:'<div class="rl">'+esc(nm)+'</div>'})}))});
  rlG=L.layerGroup(ms);syncLabels();updateBanner();
}
function syncLabels(){if(!rlG)return;if(map.getZoom()>=14){if(!map.hasLayer(rlG))rlG.addTo(map)}else if(map.hasLayer(rlG))map.removeLayer(rlG)}
map.on("zoomend",syncLabels);
$("dinfo").onclick=function(e){
  if(e.target.closest("#rc"))recenter();
  else if(e.target.closest("#ov"))overview();
};
$("nvx").onclick=function(){setDest(null)};
buildPicker();renderList();showInfo("");connect();
})();
</script>
