<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convoy Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d21;--mut:#6b7280;--line:#e2e5ea;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#1a1e24;--text:#eef0f3;--mut:#9aa3af;--line:#2a3039;--acc:#60a5fa;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;width:100%;font-weight:600}
button.sm{width:auto;padding:8px 12px;font-size:14px;background:var(--card);color:var(--text);border:1px solid var(--line)}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--line)}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opt{width:auto;padding:6px 10px;background:var(--card);color:var(--text);border:2px solid var(--line);font-weight:500;font-size:15px}
.opt.on{border-color:var(--acc)}
.opt svg{width:36px;height:20px;vertical-align:middle;margin-right:6px}
.sw{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid transparent}.sw.on{border-color:var(--text)}
.cc{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;margin-bottom:8px}
input[type=color]{width:44px;height:32px;border:0;padding:0;background:none}
#status{color:var(--mut);font-size:14px;margin:8px 2px}
.sub{color:var(--mut);font-size:13px}.nm{font-weight:600}
#setup{flex:1;overflow-y:auto;padding:16px 14px 8px}
#gobar{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
#gobar button{font-size:19px;font-weight:700;padding:17px;border-radius:16px;letter-spacing:.3px;background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 6px 18px rgba(22,163,74,.45);transition:transform .1s}
#gobar button:active{transform:scale(.98)}
#gobar button:disabled{background:var(--card);color:var(--mut);box-shadow:none;border:1px solid var(--line);font-weight:600}
#gobar button.sec{background:transparent;color:var(--mut);box-shadow:none;border:1px solid var(--line)}
#gobar button:not(:disabled):not(.sec){animation:rdy 2s ease-in-out infinite}
@keyframes rdy{0%,100%{box-shadow:0 6px 18px rgba(22,163,74,.45)}50%{box-shadow:0 6px 26px rgba(22,163,74,.75)}}
body.live #setup,body.live #gobar{display:none}
body:not(.live) #live{display:none}
#live{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;z-index:0;background:#e5e7eb}
#topbar{position:absolute;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:66px}
#sb{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#sb input{margin:0;border:0;background:transparent;flex:1;min-width:0}
#sb button{width:auto;padding:8px 14px}
#dres{background:var(--card);border-radius:14px;margin-top:6px;box-shadow:0 2px 12px rgba(0,0,0,.35);overflow:hidden}
#dres button,#dres .sub{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border-radius:0;border-bottom:1px solid var(--line);font-weight:500;font-size:15px;padding:11px 14px}
#dres:empty{display:none}
#fab{position:absolute;z-index:1000;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
#fab button{width:46px;height:46px;padding:0;border-radius:50%;background:var(--card);color:var(--text);font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#toast{display:none;position:absolute;z-index:1100;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:80%;background:rgba(17,24,39,.92);color:#fff;font-size:14px;padding:8px 14px;border-radius:12px;text-align:center}
#panel{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:58%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.3);padding:4px 14px calc(12px + env(safe-area-inset-bottom,0px))}
#hd{background:transparent;color:var(--mut);font-size:13px;padding:6px 0 8px;font-weight:500}
#panel.min #more{display:none}
body.full #panel,body.full #topbar{display:none}
.bar{display:flex;gap:8px;margin:8px 0}.bar button{flex:1}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.pw{position:relative;width:100px;height:70px}
.ring{position:absolute;left:22px;top:0;width:56px;height:56px;border-radius:50%;border:2px solid}
.pw svg{position:absolute;left:22px;top:12px;width:56px;height:31px;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.me .ring{animation:pl 2s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(37,99,235,.55)}100%{box-shadow:0 0 0 20px rgba(37,99,235,0)}}
.lb,.lb2{display:flex;align-items:center;gap:5px;white-space:nowrap;max-width:100px;background:rgba(255,255,255,.95);color:#111;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lb{position:absolute;left:50%;top:56px;transform:translateX(-50%)}
.lb i{width:8px;height:8px;border-radius:50%;flex:none}
.lb2{overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.dp{width:110px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.dp svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.leaflet-container{font:inherit}
body.dk .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
body.dk #map{background:#1c1f24}
</style>
</head>
<body>

  <input type="text" id="vname" maxlength="20" placeholder="Pangalan (hal. Kotse ni Ben)">
  <input type="text" id="vq" placeholder="Hanapin ang uri (hal. jeep, bangka, trike)">

  <label class="cc">Sariling kulay: <input type="color" id="cc" value="#2563eb"></label>

</div>
<div id="gobar"><button id="share">Pumili muna ng sasakyan</button></div>
<div id="live">
  <div id="map"></div>
  <div id="topbar"><div id="sb"><input type="text" id="dq" placeholder="Saan pupunta?"><button id="dgo">Hanapin</button></div><div id="dres"></div></div>
  <div id="fab"><button id="fit" aria-label="Fit lahat">🎯</button><button id="trf" aria-label="Traffic">🚦</button><button id="thm" aria-label="Tema">🌙</button><button id="full" aria-label="Full view">⛶</button></div>
  <div id="toast"></div>
  <div id="panel" class="min">
    <button id="hd">▲ Mga sasakyan at opsyon</button>
    <div id="dinfo"></div>
    <div id="more">
      <div class="bar"><button class="sm" id="stop" style="color:#dc2626">Itigil</button><button class="sm" id="inv">Imbitahin</button><button class="sm" id="dclr" style="display:none">Alisin ang destinasyon</button></div>
      <div id="st2" class="sub"></div>
      <div id="list"></div>
      <div class="sub" style="font-size:11px;margin-top:8px">© OpenStreetMap · CARTO · Leaflet</div>
    </div>
  </div>
</div>
</div>

function dist(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function fmtD(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(m<10000?1:0)+" km"}
function ago(t){var s=Math.max(0,(Date.now()-t)/1000);if(s<30)return"live";if(s<3600)return Math.round(s/60)+" min ang nakaraan";return Math.round(s/3600)+" oras ang nakaraan"}
function renderList(){
  var ids=Object.keys(people),me=people[myId];
  if(!ids.length){$("list").innerHTML='<div class="sub" style="text-align:center;padding:12px">Wala pang naka-GPS.</div>';return}
  ids.sort(function(a,b){return a===myId?-1:b===myId?1:people[b].ts-people[a].ts});
  $("list").innerHTML=ids.map(function(i){var p=people[i],d=(me&&i!==myId)?" · "+fmtD(dist(me,p))+" ang layo":"";
    return '<div class="row" data-id="'+esc(i)+'"><svg viewBox="0 0 40 22" width="52" height="29" style="flex:none">'+ico(p.v,p.c)+'</svg><div><div class="nm">'+esc(p.n)+(i===myId?" (ikaw)":"")+'</div><div class="sub">'+ago(p.ts)+d+'</div></div></div>'}).join("");
}
$("list").addEventListener("click",function(e){var r=e.target.closest("[data-id]");if(!r)return;var p=people[r.dataset.id];if(p){userMoved=true;map.setView([p.lat,p.lng],17)}});
$("fit").onclick=function(){userMoved=false;fitAll()};
$("hd").onclick=function(){var p=$("panel");p.classList.toggle("min");$("hd").textContent=p.classList.contains("min")?"▲ Mga sasakyan at opsyon":"▼ Itago"};
$("thm").onclick=function(){dark=!dark;try{localStorage.setItem("convoyDark",dark?"1":"0")}catch(e){}setBase()};
$("full").onclick=function(){document.body.classList.toggle("full");if(!userMoved)setTimeout(fitAll,150)};
$("inv").onclick=function(){var u=location.href;
  if(navigator.share)navigator.share({title:"Convoy Map",text:"Sumali sa convoy map namin:",url:u}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){status("Na-copy ang link. I-paste sa kasama mo.")});
  else prompt("Kopyahin ang link:",u)};
$("trf").onclick=function(){
  if(!TOMTOM_KEY){status("Para sa live traffic, kailangan ng libreng TomTom API key.");return}
  if(tfl){map.removeLayer(tfl);tfl=null;$("trf").style.boxShadow="";return}
  tfl=L.tileLayer("https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key="+TOMTOM_KEY,{maxZoom:20,opacity:.9}).addTo(map);$("trf").style.boxShadow="0 0 0 3px #16a34a"};

function syncDest(r){
  if(r.dts===undefined||!(r.dts>destTs))return;
  dest=(r.dest&&typeof r.dest.lat==="number"&&typeof r.dest.lng==="number")?{lat:r.dest.lat,lng:r.dest.lng,name:String(r.dest.name||"Destinasyon").slice(0,40)}:null;
  destTs=r.dts;drawDest();
}
function setDest(d){dest=d;destTs=Date.now();userMoved=false;drawDest();if(sharing)push(true)}
function showInfo(stat){$("dinfo").innerHTML=dest?'<div class="nm">📍 '+esc(dest.name)+'</div><div class="sub">'+stat+'</div>':'<div class="sub">Maghanap sa taas o pindutin nang matagal ang mapa para maglagay ng destinasyon.</div>'}
function drawDest(){
  if(destMk){map.removeLayer(destMk);destMk=null}
  if(routeLn){map.removeLayer(routeLn);routeLn=null}routeB=null;
  $("dclr").style.display=dest?"":"none";
  if(!dest){showInfo("");return}
  destMk=L.marker([dest.lat,dest.lng],{zIndexOffset:500,icon:L.divIcon({className:"",iconSize:[110,76],iconAnchor:[55,76],
    html:'<div class="dp"><div class="lb2">'+esc(dest.name)+'</div><svg viewBox="0 0 24 32" width="34" height="44"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20 12 32 12 32s12-12 12-20.3C24 5.2 18.6 0 12 0z" fill="#ef4444" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="11.5" r="4.5" fill="#fff"/></svg></div>'})}).addTo(map);
  showInfo("Hinahanap ang ruta…");refit=true;routeFrom=null;doRoute();if(!userMoved)fitAll();
}
function doRoute(){
  var me=people[myId];if(!dest||!me)return;
  var now=Date.now();if(routeFrom&&dist(routeFrom,me)<200&&now-routeAt<90000)return;
  routeFrom={lat:me.lat,lng:me.lng};routeAt=now;var tgt=dest;
  fetch("https://router.project-osrm.org/route/v1/driving/"+me.lng+","+me.lat+";"+dest.lng+","+dest.lat+"?overview=full&geometries=geojson")
  .then(function(r){return r.json()}).then(function(j){
    if(tgt!==dest||!j.routes||!j.routes[0])return;var r=j.routes[0];
    if(routeLn)map.removeLayer(routeLn);
    var st={lineCap:"round",lineJoin:"round"};
    var c=L.geoJSON(r.geometry,{style:Object.assign({color:"#ffffff",weight:11,opacity:.95},st)}),l=L.geoJSON(r.geometry,{style:Object.assign({color:"#3b82f6",weight:7,opacity:1},st)});
    routeLn=L.layerGroup([c,l]).addTo(map);routeB=l.getBounds();
    var mins=Math.max(1,Math.round(r.duration/60)),eta=new Date(Date.now()+r.duration*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    showInfo(fmtD(r.distance)+" · mga "+mins+" min · dating "+eta+" (estimate, walang traffic)");
    if(refit){refit=false;if(!userMoved)fitAll()}
  }).catch(function(){if(tgt===dest)showInfo("hindi makuha ang ruta ngayon")});
}
function search(){
  var q=$("dq").value.trim();if(!q)return;$("dres").innerHTML='<div class="sub">Naghahanap…</div>';
  var b=map.getBounds();
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&q="+encodeURIComponent(q)+"&viewbox="+[b.getWest(),b.getNorth(),b.getEast(),b.getSouth()].join(","))
  .then(function(r){return r.json()}).then(function(j){
    lastRes=j||[];
    $("dres").innerHTML=lastRes.length?lastRes.map(function(r,i){return '<button data-i="'+i+'">'+esc(r.display_name.split(",").slice(0,3).join(","))+'</button>'}).join(""):'<div class="sub">Walang nahanap.</div>';
  }).catch(function(){$("dres").innerHTML='<div class="sub">Hindi makapaghanap ngayon.</div>'});
}
$("dgo").onclick=search;
$("dq").onkeydown=function(e){if(e.key==="Enter")search()};
$("dres").onclick=function(e){var b=e.target.closest("[data-i]");if(!b)return;var r=lastRes[+b.dataset.i];if(!r)return;
  $("dres").innerHTML="";$("dq").value="";$("dq").blur();setDest({lat:+r.lat,lng:+r.lon,name:r.display_name.split(",").slice(0,2).join(",").trim()})};
$("dclr").onclick=function(){setDest(null)};
map.on("contextmenu",function(e){setDest({lat:e.latlng.lat,lng:e.latlng.lng,name:"Napiling lugar"})});

function connect(){
  var es=new EventSource(base+"/sse?since=20m");
  es.onmessage=function(e){try{var m=JSON.parse(e.data);if(m.event&&m.event!=="message")return;handle(JSON.parse(m.message))}catch(x){}};
}
function send(d){fetch(base,{method:"POST",body:JSON.stringify(d)}).catch(function(){status("Walang internet o hindi maipadala.")})}
function push(force){
  if(!lastPos)return;var now=Date.now();if(!force&&now-lastSend<8000)return;lastSend=now;
  var d={id:myId,n:veh.n||typeLabel(),v:veh.t,c:veh.c,lat:lastPos.coords.latitude,lng:lastPos.coords.longitude,ts:now,dest:dest,dts:destTs};
  handle(d);send(d);
}
function setBtn(){var b=$("share");if(sharing)return;b.disabled=!veh.t;b.style.opacity=1;b.className="";b.textContent=veh.t?"🚀 GO – Buksan ang GPS":"Pumili muna ng sasakyan"}
function start(){
  if(!veh.t){status("Pumili muna ng uri ng sasakyan.");return}
  if(!navigator.geolocation){status("Hindi kayang mag-GPS ng device na ito.");return}
  document.body.classList.add("live");try{map.invalidateSize()}catch(e){}userMoved=false;sharing=true;showInfo("");
  status("Hinahanap ang GPS… lumabas sa bukas na lugar kung matagal.");
  function ok(p){try{var first=!lastPos;lastPos=p;if(first)status("Live ka na sa mapa. Iwanang bukas ang app.");push(first);if(first)setTimeout(fitAll,400)}catch(e){status("May error: "+e.message)}}
  function bad(e){if(e.code===1){status("Hindi pinayagan ang location. I-enable sa browser settings.");stop(true)}else status("Hinahanap pa ang GPS… i-on ang Location/GPS ng phone.")}
  navigator.geolocation.getCurrentPosition(ok,function(){},{enableHighAccuracy:false,maximumAge:60000,timeout:15000});
  watchId=navigator.geolocation.watchPosition(ok,bad,{enableHighAccuracy:true,maximumAge:3000,timeout:30000});
  $("share").textContent="Itigil ang GPS";$("share").className="sec";
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}
}
function stop(keep){
  document.body.classList.remove("live","full");
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;sharing=false;lastPos=null;
  try{wl&&wl.release()}catch(e){}wl=null;setBtn();
  if(!keep){send({id:myId,off:1});drop(myId);renderList();$("status").textContent="Tinigil mo na ang GPS."}
}
$("share").onclick=function(){watchId==null?start():stop(false)};
$("stop").onclick=function(){stop(false)};
setInterval(function(){if(sharing)push(true)},15000);
setInterval(renderList,30000);

function buildPicker(){
  $("vname").value=veh.n;
  $("types").innerHTML=TYPES.filter(function(t){return (t[1]+" "+t[2]).toLowerCase().indexOf(Q)>-1}).map(function(t){
    return '<button class="opt'+(veh.t===t[0]?' on':'')+'" data-t="'+t[0]+'"><svg viewBox="0 0 40 22">'+ico(t[0],veh.c)+'</svg>'+t[1]+'</button>'}).join("");
  $("colors").innerHTML=COLS.map(function(c){return '<button class="sw'+(veh.c===c?' on':'')+'" data-c="'+c+'" style="background:'+c+'" aria-label="Kulay"></button>'}).join("");
  $("cc").value=veh.c;setBtn();
}
function changed(){saveV();buildPicker();if(sharing)push(true)}
$("types").onclick=function(e){var b=e.target.closest("[data-t]");if(b){veh.t=b.dataset.t;changed()}};
$("colors").onclick=function(e){var b=e.target.closest("[data-c]");if(b){veh.c=b.dataset.c;changed()}};
$("cc").onchange=function(e){veh.c=e.target.value;changed()};
$("vq").oninput=function(e){Q=e.target.value.trim().toLowerCase();buildPicker()};
$("vname").oninput=function(e){veh.n=e.target.value;saveV();clearTimeout(window._nt);window._nt=setTimeout(function(){if(sharing)push(true)},600)};
buildPicker();renderList();showInfo("");connect();
})();
</script>
</body>
</html>
